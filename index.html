<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELK-BLEDOB Controller</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 20px; background: #121212; color: #fff; }
    .card { background: #1e1e1e; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    button { padding: 12px 20px; margin: 8px; font-size: 15px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
    .btn-connect { background: #2196F3; color: white; width: 90%; }
    .btn-on { background: #4CAF50; color: white; width: 40%; }
    .btn-off { background: #f44336; color: white; width: 40%; }
    .color-btn { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #fff; margin: 6px; cursor: pointer; display: inline-block; }
    input[type="color"] { width: 90%; height: 50px; border: none; border-radius: 8px; cursor: pointer; background: transparent; }
    #status { margin-top: 15px; font-weight: bold; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>ELK-BLEDOB Control</h2>
    <button class="btn-connect" onclick="connectBLE()">🔌 Connect Light</button>
    <p id="status">Status: Disconnected</p>

    <hr style="border: 0.5px solid #333; margin: 20px 0;">

    <h3>Power</h3>
    <button class="btn-on" onclick="sendPower(true)">ON</button>
    <button class="btn-off" onclick="sendPower(false)">OFF</button>

    <h3>Quick Colors</h3>
    <div>
      <span class="color-btn" style="background: red;" onclick="sendRGB(255, 0, 0)"></span>
      <span class="color-btn" style="background: green;" onclick="sendRGB(0, 255, 0)"></span>
      <span class="color-btn" style="background: blue;" onclick="sendRGB(0, 0, 255)"></span>
      <span class="color-btn" style="background: white;" onclick="sendRGB(255, 255, 255)"></span>
    </div>

    <h3>Color Picker</h3>
    <input type="color" id="picker" value="#ff0000" oninput="handleColorPicker(this.value)">
  </div>

  <script>
    const SERVICE_UUID = "0000fff0-0000-1000-8000-00805f9b34fb";
    const WRITE_UUID   = "0000fff3-0000-1000-8000-00805f9b34fb";

    let writeChar = null;

    async function connectBLE() {
      const statusEl = document.getElementById("status");
      try {
        statusEl.innerText = "Status: Searching for light...";
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID, 0xFFF0]
        });

        statusEl.innerText = `Status: Connecting to ${device.name || 'Device'}...`;
        const server = await device.gatt.connect();
        
        const service = await server.getPrimaryService(SERVICE_UUID);
        writeChar = await service.getCharacteristic(WRITE_UUID);

        statusEl.innerText = "Status: Connected & Ready! 🚀";
        statusEl.style.color = "#4CAF50";
      } catch (err) {
        statusEl.innerText = "Status: Error - " + err.message;
        statusEl.style.color = "#f44336";
      }
    }

    async function sendPacket(bytesArray) {
      if (!writeChar) {
        alert("Click 'Connect Light' first!");
        return;
      }
      try {
        const data = new Uint8Array(bytesArray);
        await writeChar.writeValueWithoutResponse(data);
      } catch (e) {
        console.error("Write error:", e);
      }
    }

    function sendPower(on) {
      const val = on ? 0xFF : 0x00;
      sendPacket([0x7E, 0x07, 0x04, val, 0x00, 0x00, 0x00, 0x00, 0xEF]);
    }

    function sendRGB(r, g, b) {
      sendPacket([0x7E, 0x07, 0x05, 0x03, r, g, b, 0x10, 0xEF]);
    }

    function handleColorPicker(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      sendRGB(r, g, b);
    }
  </script>
</body>
</html>
